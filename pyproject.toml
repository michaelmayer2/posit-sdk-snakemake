[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemake-executor-plugin-workbench"
version = "0.1.0"
description = "Snakemake executor plugin for Posit Workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "posit-sdk",
    "snakemake-interface-executor-plugins>=9.3,<10",
]

[project.optional-dependencies]
snakemake = ["snakemake"]
dev = [
    "pytest",
    "responses",
    "ruff",
    "snakemake-executor-plugin-workbench[snakemake]",
]

[tool.uv.sources]
posit-sdk = { git = "https://github.com/michaelmayer2/posit-sdk-py", branch = "workbench" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["I"]
